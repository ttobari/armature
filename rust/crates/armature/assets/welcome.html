<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome — Armature</title>
<style>
  :root {
    --crust: #232634; --base: #303446; --surface: #414559;
    --text: #c6d0f5; --sub: #a5adce; --yellow: #e5c890;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--crust); color: var(--text);
    font: 17px/1.7 -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 32px; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 32px; letter-spacing: .02em; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--surface); }
  td:first-child { width: 72px; }
  kbd {
    display: inline-block; min-width: 28px; padding: 2px 8px; border-radius: 6px;
    background: var(--base); border: 1px solid var(--surface); color: var(--yellow);
    font: 15px/1.6 "SF Mono", Menlo, monospace; text-align: center;
  }
  p { margin: 32px 0 0; color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <table>
    <tr><td><kbd>⌘B</kbd></td><td>Switch between the browser and Claude</td></tr>
    <tr><td><kbd>⌘T</kbd></td><td>New Claude session</td></tr>
  </table>
  <p>For anything else, ask Claude.</p>
</main>
</body>
</html>
