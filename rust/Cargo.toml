# 器は `armature`(アプリ本体)、`armature-core` はその下の層
# (セッションの名簿・タスクの読み書き・暦)。
[workspace]
resolver = "3"
members = ["crates/armature-core", "crates/armature"]
# vendor は差し替えた複製(iced_term)で、ワークスペースの一員ではない。
exclude = ["vendor"]

[workspace.dependencies]
jiff = "0.2"
libc = "0.2"
serde_json = "1.0"
regex = "1"

[workspace.package]
version = "0.1.0"
edition = "2024"
# 最低 rustc 版(edition 2024 の下限)。器の crate は wgpu の都合で 1.92。
rust-version = "1.88"

[profile.release]
# crate をまたぐ ThinLTO(`lto = "thin"`)は付けない。毎回のリンクで iced / wgpu / wry まで
# 含む全 crate を再最適化する時間のほうが効くため(既定 = crate 内だけの thin-local LTO)。

