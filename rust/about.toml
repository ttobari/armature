# Settings for the third-party license list (licenses/rust-crates.html).
# Rebuild it after changing dependencies:
#   cargo about generate --manifest-path rust/Cargo.toml -c rust/about.toml rust/about.hbs -o licenses/rust-crates.html
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "WTFPL",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Armature's own crates are covered by the LICENSE file at the top of the repository.
private = { ignore = true }
